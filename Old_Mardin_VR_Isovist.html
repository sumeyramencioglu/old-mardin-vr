<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Old Mardin VR — İsovist Görselleştirme</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0d14; color:#e2e8f0; font-family:'Inter',sans-serif; overflow:hidden; height:100vh; }
.app { display:flex; height:100vh; }
.sidebar { width:320px; background:#0f1219; border-right:1px solid #1e293b; display:flex; flex-direction:column; z-index:10; }
.sidebar-header { padding:20px; border-bottom:1px solid #1e293b; }
.sidebar-header h1 { font-size:18px; font-weight:700; background:linear-gradient(135deg,#3b82f6,#8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.sidebar-header p { font-size:11px; color:#64748b; margin-top:4px; }
.controls { padding:16px 20px; border-bottom:1px solid #1e293b; }
.control-row { display:flex; gap:8px; margin-bottom:10px; align-items:center; }
.control-row label { font-size:11px; color:#94a3b8; min-width:60px; }
select, button { background:#1a1f2e; color:#e2e8f0; border:1px solid #2d3748; border-radius:8px; padding:6px 12px; font-size:12px; font-family:inherit; cursor:pointer; transition:all 0.2s; }
select:hover, button:hover { border-color:#3b82f6; background:#1e2538; }
button.primary { background:linear-gradient(135deg,#3b82f6,#6366f1); border:none; font-weight:600; }
.btn-group { display:flex; gap:4px; }
.btn-group button { flex:1; padding:6px 8px; font-size:11px; }
.btn-group button.active { background:#3b82f6; border-color:#3b82f6; }
.speed-control { display:flex; align-items:center; gap:8px; }
.speed-control input[type=range] { flex:1; accent-color:#3b82f6; }
.info-panel { flex:1; overflow-y:auto; padding:16px 20px; }
.info-card { background:#1a1f2e; border:1px solid #2d3748; border-radius:12px; padding:14px; margin-bottom:10px; }
.info-card h3 { font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.info-value { font-size:24px; font-weight:700; color:#e2e8f0; }
.info-value.small { font-size:14px; }
.info-value span { font-size:12px; font-weight:400; color:#64748b; }
.info-row { display:flex; justify-content:space-between; margin-bottom:4px; }
.info-row .label { font-size:11px; color:#94a3b8; }
.info-row .value { font-size:12px; font-weight:600; color:#e2e8f0; }
.target-badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; margin:2px; }
.landmark-list { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.legend { padding:16px 20px; border-top:1px solid #1e293b; }
.legend h3 { font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.legend-item { display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:11px; }
.legend-color { width:14px; height:14px; border-radius:4px; }
.canvas-area { flex:1; position:relative; }
canvas { display:block; width:100%; height:100%; }
.progress-bar { position:absolute; bottom:0; left:0; right:0; height:4px; background:#1a1f2e; }
.progress-fill { height:100%; background:linear-gradient(90deg,#3b82f6,#8b5cf6); transition:width 0.1s; }
.timeline { position:absolute; bottom:20px; left:20px; right:20px; background:rgba(15,18,25,0.9); backdrop-filter:blur(10px); border:1px solid #2d3748; border-radius:12px; padding:10px 16px; display:flex; align-items:center; gap:12px; }
.timeline input[type=range] { flex:1; accent-color:#3b82f6; height:4px; }
.timeline .time-display { font-size:12px; font-weight:500; color:#94a3b8; min-width:80px; text-align:center; }
.stats-overlay { position:absolute; top:16px; right:16px; display:flex; flex-direction:column; gap:8px; }
.stat-chip { background:rgba(15,18,25,0.85); backdrop-filter:blur(10px); border:1px solid #2d3748; border-radius:10px; padding:8px 14px; font-size:12px; display:flex; align-items:center; gap:8px; }
.stat-chip .dot { width:8px; height:8px; border-radius:50%; }
.stat-chip .val { font-weight:700; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Old Mardin VR</h1>
      <p>Isovist Gorsellestirme — Simulark Tarzi</p>
    </div>
    <div class="controls">
      <div class="control-row">
        <label>Katilimci</label>
        <select id="pidSelect" style="flex:1"></select>
      </div>
      <div class="control-row">
        <div class="btn-group" style="flex:1">
          <button id="btnPlay" class="primary" onclick="togglePlay()">&#9654; Oynat</button>
          <button onclick="resetAnim()">&#8634; Sifirla</button>
        </div>
      </div>
      <div class="control-row speed-control">
        <label>Hiz</label>
        <input type="range" id="speedSlider" min="1" max="20" value="5" oninput="updateSpeed()">
        <span id="speedLabel" style="font-size:11px;color:#94a3b8;min-width:30px">5x</span>
      </div>
      <div class="control-row">
        <label>Gorunum</label>
        <div class="btn-group" style="flex:1">
          <button id="btnIso" class="active" onclick="toggleLayer('isovist')">Isovist</button>
          <button id="btnTrail" class="active" onclick="toggleLayer('trail')">Iz</button>
          <button id="btnDir" class="active" onclick="toggleLayer('direction')">Yon</button>
        </div>
      </div>
    </div>
    <div class="info-panel">
      <div class="info-card"><h3>Zaman</h3><div class="info-value" id="infoTime">0.0<span>s</span></div></div>
      <div class="info-card"><h3>Isovist Alani</h3><div class="info-value" id="infoIsovist">0.0<span>m2</span></div></div>
      <div class="info-card"><h3>Bakis Hedefi</h3><div class="info-value small" id="infoTarget">-</div></div>
      <div class="info-card"><h3>Gorulen Bina Sayisi</h3><div class="info-value" id="infoSeen">0<span>/13</span></div></div>
      <div class="info-card"><h3>Landmark</h3><div class="landmark-list" id="infoLandmarks">-</div></div>
      <div class="info-card"><h3>Konum</h3>
        <div class="info-row"><span class="label">X</span><span class="value" id="infoPosX">0.0</span></div>
        <div class="info-row"><span class="label">Z</span><span class="value" id="infoPosZ">0.0</span></div>
      </div>
    </div>
    <div class="legend">
      <h3>Sokak Kategorileri</h3>
      <div class="legend-item"><div class="legend-color" style="background:#3b82f6"></div>A Sokagi (Ana Cadde)</div>
      <div class="legend-item"><div class="legend-color" style="background:#10b981"></div>B Sokagi</div>
      <div class="legend-item"><div class="legend-color" style="background:#f59e0b"></div>C Sokagi</div>
      <div class="legend-item"><div class="legend-color" style="background:#8b5cf6"></div>D Sokagi</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(255,255,255,0.1)"></div>Gorulmemis</div>
    </div>
  </div>
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="stats-overlay">
      <div class="stat-chip"><div class="dot" style="background:#10b981"></div>Ilerleme: <span class="val" id="statProgress">0%</span></div>
      <div class="stat-chip"><div class="dot" style="background:#f59e0b"></div>Geri Donus: <span class="val" id="statBacktrack">0</span></div>
    </div>
    <div class="timeline">
      <button onclick="stepBack()" style="padding:4px 8px;font-size:14px">&#9664;</button>
      <input type="range" id="timeSlider" min="0" max="100" value="0" oninput="seekTo(this.value)">
      <button onclick="stepForward()" style="padding:4px 8px;font-size:14px">&#9654;</button>
      <div class="time-display" id="timeDisplay">0.0s / 0.0s</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>
<script>
var DATA=null,currentPid='16',trajectory=[],frameIndex=0,isPlaying=false,playSpeed=5,animFrame=null,lastTime=0,seenStreets={};
var layers={isovist:true,trail:true,direction:true};
var CATEGORY_COLORS={'A':'#3b82f6','B':'#10b981','C':'#f59e0b','D':'#8b5cf6'};
var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');

function resizeCanvas(){canvas.width=canvas.parentElement.clientWidth*window.devicePixelRatio;canvas.height=canvas.parentElement.clientHeight*window.devicePixelRatio;ctx.setTransform(window.devicePixelRatio,0,0,window.devicePixelRatio,0,0);}
window.addEventListener('resize',function(){resizeCanvas();draw();});

function loadData(){
  var xhr=new XMLHttpRequest();
  xhr.open('GET','isovist_animation_data.json',true);
  xhr.onload=function(){
    if(xhr.status===200){
      DATA=JSON.parse(xhr.responseText);
      var sel=document.getElementById('pidSelect');
      var pids=Object.keys(DATA.all_trajectories).sort(function(a,b){return parseInt(a)-parseInt(b);});
      for(var i=0;i<pids.length;i++){
        var opt=document.createElement('option');
        opt.value=pids[i];
        opt.text='P'+pids[i]+' ('+DATA.all_trajectories[pids[i]].length+' frame)';
        if(pids[i]==='16')opt.selected=true;
        sel.appendChild(opt);
      }
      sel.onchange=function(){currentPid=this.value;loadTrajectory();resetAnim();};
      loadTrajectory();resizeCanvas();draw();
    }
  };
  xhr.send();
}

function loadTrajectory(){
  if(currentPid==='16'&&DATA.p16_trajectory){trajectory=DATA.p16_trajectory;}
  else{trajectory=DATA.all_trajectories[currentPid]||[];}
  document.getElementById('timeSlider').max=Math.max(0,trajectory.length-1);
}

function worldToScreen(wx,wz){
  var cw=canvas.width/window.devicePixelRatio,ch=canvas.height/window.devicePixelRatio;
  var m=40,b=DATA.map_bounds;
  var sx=(cw-m*2)/(b.x_max-b.x_min),sz=(ch-m*2)/(b.z_max-b.z_min);
  var s=Math.min(sx,sz),cx=cw/2,cy=ch/2;
  var mx=(b.x_min+b.x_max)/2,mz=(b.z_min+b.z_max)/2;
  return{x:cx+(wx-mx)*s,y:cy-(wz-mz)*s};
}

function getScale(){
  var cw=canvas.width/window.devicePixelRatio,ch=canvas.height/window.devicePixelRatio;
  var m=40,b=DATA.map_bounds;
  var sx=(cw-m*2)/(b.x_max-b.x_min),sz=(ch-m*2)/(b.z_max-b.z_min);
  return Math.min(sx,sz);
}

function hexToRgba(hex,a){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'rgba('+r+','+g+','+b+','+a+')';}

function drawStreets(){
  var streets=DATA.street_boundaries,cats=DATA.street_categories;
  for(var name in streets){
    var pts=streets[name];if(pts.length<3)continue;
    ctx.beginPath();
    var p0=worldToScreen(pts[0][0],pts[0][1]);ctx.moveTo(p0.x,p0.y);
    for(var i=1;i<pts.length;i++){var p=worldToScreen(pts[i][0],pts[i][1]);ctx.lineTo(p.x,p.y);}
    ctx.closePath();
    var cat=cats[name]||'A',color=CATEGORY_COLORS[cat]||'#64748b';
    var frame=trajectory[frameIndex];
    if(seenStreets[name]){
      var isCur=frame&&frame.la===name;
      ctx.fillStyle=hexToRgba(color,isCur?0.5:0.2);ctx.fill();
      ctx.strokeStyle=hexToRgba(color,isCur?1.0:0.5);ctx.lineWidth=isCur?2.5:1;
    }else{
      ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=0.5;
    }
    ctx.stroke();
    if(seenStreets[name]){
      var sx=0,sz=0;for(var i=0;i<pts.length;i++){sx+=pts[i][0];sz+=pts[i][1];}
      var sc=worldToScreen(sx/pts.length,sz/pts.length);
      ctx.fillStyle=hexToRgba(color,0.7);ctx.font='bold 9px Inter';ctx.textAlign='center';
      ctx.fillText(name.replace('STR_',''),sc.x,sc.y);
    }
  }
}

function drawIsovist(frame){
  if(!layers.isovist||!frame)return;
  var pos=worldToScreen(frame.x,frame.z);
  var angle=Math.atan2(frame.dz,frame.dx);
  var fov=60*Math.PI/180,radius=50;
  var screenR=radius*getScale();
  var grad=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,screenR);
  grad.addColorStop(0,'rgba(59,130,246,0.25)');grad.addColorStop(0.5,'rgba(59,130,246,0.1)');grad.addColorStop(1,'rgba(59,130,246,0)');
  ctx.beginPath();ctx.moveTo(pos.x,pos.y);
  var sa=-angle-fov/2,ea=-angle+fov/2;
  ctx.arc(pos.x,pos.y,screenR,sa,ea);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.moveTo(pos.x,pos.y);
  ctx.lineTo(pos.x+Math.cos(sa)*screenR,pos.y+Math.sin(sa)*screenR);
  ctx.moveTo(pos.x,pos.y);ctx.lineTo(pos.x+Math.cos(ea)*screenR,pos.y+Math.sin(ea)*screenR);
  ctx.strokeStyle='rgba(59,130,246,0.3)';ctx.lineWidth=1;ctx.stroke();
}

function drawTrail(){
  if(!layers.trail||frameIndex<1)return;
  var start=Math.max(0,frameIndex-200);
  for(var i=start;i<frameIndex;i++){
    var f=trajectory[i],n=trajectory[i+1];if(!n)break;
    var p1=worldToScreen(f.x,f.z),p2=worldToScreen(n.x,n.z);
    var alpha=0.1+0.5*((i-start)/(frameIndex-start));
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
    ctx.strokeStyle='rgba(236,72,153,'+alpha+')';ctx.lineWidth=2;ctx.stroke();
  }
}

function drawPlayer(frame){
  if(!frame)return;
  var pos=worldToScreen(frame.x,frame.z);
  var glow=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,20);
  glow.addColorStop(0,'rgba(59,130,246,0.4)');glow.addColorStop(1,'rgba(59,130,246,0)');
  ctx.fillStyle=glow;ctx.fillRect(pos.x-20,pos.y-20,40,40);
  ctx.beginPath();ctx.arc(pos.x,pos.y,6,0,Math.PI*2);ctx.fillStyle='#3b82f6';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  if(layers.direction){
    var angle=Math.atan2(frame.dz,frame.dx),len=25;
    var ex=pos.x+Math.cos(-angle)*len,ey=pos.y+Math.sin(-angle)*len;
    ctx.beginPath();ctx.moveTo(pos.x,pos.y);ctx.lineTo(ex,ey);ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.stroke();
    var hl=8,a1=-angle+2.7,a2=-angle-2.7;
    ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(a1)*hl,ey+Math.sin(a1)*hl);
    ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(a2)*hl,ey+Math.sin(a2)*hl);ctx.stroke();
  }
}

function drawStartEnd(){
  if(!trajectory.length)return;
  var s=worldToScreen(trajectory[0].x,trajectory[0].z);
  var e=worldToScreen(trajectory[trajectory.length-1].x,trajectory[trajectory.length-1].z);
  ctx.beginPath();ctx.arc(s.x,s.y,8,0,Math.PI*2);ctx.fillStyle='rgba(16,185,129,0.3)';ctx.fill();
  ctx.strokeStyle='#10b981';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#10b981';ctx.font='bold 10px Inter';ctx.textAlign='center';ctx.fillText('START',s.x,s.y-14);
  ctx.beginPath();ctx.arc(e.x,e.y,8,0,Math.PI*2);ctx.fillStyle='rgba(239,68,68,0.3)';ctx.fill();
  ctx.strokeStyle='#ef4444';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#ef4444';ctx.fillText('BITIS',e.x,e.y-14);
}

function draw(){
  var cw=canvas.width/window.devicePixelRatio,ch=canvas.height/window.devicePixelRatio;
  ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#0a0d14';ctx.fillRect(0,0,cw,ch);
  ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=0.5;
  for(var x=-100;x<=60;x+=20){var p1=worldToScreen(x,-60),p2=worldToScreen(x,180);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();}
  for(var z=-60;z<=180;z+=20){var p1=worldToScreen(-100,z),p2=worldToScreen(60,z);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();}
  drawStreets();var frame=trajectory[frameIndex];
  drawIsovist(frame);drawTrail();drawStartEnd();drawPlayer(frame);updateInfo(frame);
}

function updateInfo(frame){
  if(!frame)return;
  if(frame.la&&frame.la.indexOf('STR_')===0)seenStreets[frame.la]=true;
  document.getElementById('infoTime').innerHTML=frame.t.toFixed(1)+'<span>s</span>';
  document.getElementById('infoIsovist').innerHTML=frame.iso.toFixed(1)+'<span>m2</span>';
  var te=document.getElementById('infoTarget');
  if(frame.la&&frame.la.indexOf('STR_')===0){
    var cat=DATA.street_categories[frame.la]||'A',c=CATEGORY_COLORS[cat];
    te.innerHTML='<span class="target-badge" style="background:'+hexToRgba(c,0.2)+';color:'+c+'">'+frame.la+'</span>';
  }else if(frame.la){te.innerHTML='<span class="target-badge" style="background:rgba(255,255,255,0.1)">'+frame.la+'</span>';}
  else{te.textContent='-';}
  var cnt=0;for(var k in seenStreets)cnt++;
  document.getElementById('infoSeen').innerHTML=cnt+'<span>/13</span>';
  var lmE=document.getElementById('infoLandmarks');
  if(frame.lm){var ls=frame.lm.split('|');var h='';for(var i=0;i<ls.length;i++){if(ls[i].trim())h+='<span class="target-badge" style="background:rgba(245,158,11,0.2);color:#f59e0b;font-size:10px">'+ls[i]+'</span>';}lmE.innerHTML=h||'-';}
  else{lmE.textContent='-';}
  document.getElementById('infoPosX').textContent=frame.x.toFixed(1);
  document.getElementById('infoPosZ').textContent=frame.z.toFixed(1);
  var prog=trajectory.length>0?((frameIndex/(trajectory.length-1))*100):0;
  document.getElementById('statProgress').textContent=prog.toFixed(0)+'%';
  document.getElementById('progressFill').style.width=prog+'%';
  document.getElementById('timeSlider').value=frameIndex;
  var tt=trajectory.length>0?trajectory[trajectory.length-1].t:0;
  document.getElementById('timeDisplay').textContent=frame.t.toFixed(1)+'s / '+tt.toFixed(1)+'s';
}

function togglePlay(){isPlaying=!isPlaying;document.getElementById('btnPlay').innerHTML=isPlaying?'&#9646;&#9646; Duraklat':'&#9654; Oynat';if(isPlaying){lastTime=performance.now();animate();}}
function animate(){if(!isPlaying)return;var now=performance.now();if(now-lastTime>33){lastTime=now;frameIndex+=playSpeed;if(frameIndex>=trajectory.length){frameIndex=trajectory.length-1;isPlaying=false;document.getElementById('btnPlay').innerHTML='&#9654; Oynat';}draw();}if(isPlaying)animFrame=requestAnimationFrame(animate);}
function resetAnim(){isPlaying=false;frameIndex=0;seenStreets={};document.getElementById('btnPlay').innerHTML='&#9654; Oynat';draw();}
function updateSpeed(){playSpeed=parseInt(document.getElementById('speedSlider').value);document.getElementById('speedLabel').textContent=playSpeed+'x';}
function seekTo(v){frameIndex=parseInt(v);seenStreets={};for(var i=0;i<=frameIndex;i++){var f=trajectory[i];if(f&&f.la&&f.la.indexOf('STR_')===0)seenStreets[f.la]=true;}draw();}
function stepBack(){frameIndex=Math.max(0,frameIndex-playSpeed);seekTo(frameIndex);}
function stepForward(){frameIndex=Math.min(trajectory.length-1,frameIndex+playSpeed);if(trajectory[frameIndex]&&trajectory[frameIndex].la&&trajectory[frameIndex].la.indexOf('STR_')===0)seenStreets[trajectory[frameIndex].la]=true;draw();document.getElementById('timeSlider').value=frameIndex;}
function toggleLayer(n){layers[n]=!layers[n];var id=n==='isovist'?'btnIso':(n==='trail'?'btnTrail':'btnDir');var b=document.getElementById(id);if(layers[n])b.classList.add('active');else b.classList.remove('active');draw();}

document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();togglePlay();}if(e.code==='ArrowRight')stepForward();if(e.code==='ArrowLeft')stepBack();if(e.code==='KeyR')resetAnim();});

loadData();
</script>
</body>
</html>
